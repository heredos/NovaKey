# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m

# Gradle 8.9 / AGP 8.7 require JDK 17. The default java on this machine is JDK 25,
# which Gradle 8.9 cannot run on, so pin the daemon to the installed JDK 17.
# If this path is wrong for your machine, run with: JAVA_HOME=/path/to/jdk17 ./gradlew ...
org.gradle.java.home=/usr/lib/jvm/temurin-17-jdk

# AndroidX migration
android.useAndroidX=true
android.enableJetifier=false

# Keep legacy merged-R behavior (resources shared across app/core/wear modules)
android.nonTransitiveRClass=false